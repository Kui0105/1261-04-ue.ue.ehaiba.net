<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>账户中心 · 话费代充系统</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/account.css" />
</head>
<body>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>if (!App.requireLogin("account")) document.write("");</script>

  <div class="container page">
    <!-- 顶部标题 -->
    <div class="page-head">
      <h1>账户中心</h1>
      <p>查看账户交易流水明细，掌握账户消费与充值情况。</p>
    </div>

    <!-- 充值入口（个人用户不展示） -->
    <div class="panel rech-entry" id="rechEntry">
      <div class="rech-entry-info">
        <div class="rech-entry-icon">💳</div>
        <div>
          <b>账户充值</b>
          <p id="rechEntryDesc">为账户余额加款，用于话费充值消费。</p>
        </div>
      </div>
      <button class="btn btn-primary" onclick="openRecharge()">立即充值</button>
    </div>

    <!-- 卡片数据：账户余额 / 可用预授信额度 / 累计消费金额 / 累计充值金额 -->
    <div class="tiles" id="balanceTiles" style="margin-bottom:18px"></div>

    <!-- 交易明细（含筛选 + 表格 + 分页） -->
    <div class="panel acct-flow-panel">
      <div class="acct-flow-head">
        <h3 style="margin:0">交易明细</h3>
      </div>

      <!-- 个人用户汇总（替代隐藏的卡片数据：此处展示累计消费金额） -->
      <div class="flow-summary" id="flowSummary" style="display:none"></div>

      <!-- 列表筛选栏 -->
      <div class="flow-filter-bar">
        <div class="filter-field">
          <label>流水号 / 订单号</label>
          <input type="text" id="flowKeyword" placeholder="输入关键词搜索…" oninput="applyFlowFilter()" />
        </div>
        <div class="filter-field">
          <label>交易类型</label>
          <select id="flowTypeFilter" onchange="applyFlowFilter()">
            <option value="">全部类型</option>
            <option value="话费充值">话费充值</option>
            <option value="短信群发">短信群发</option>
            <option value="平台充值">平台充值</option>
            <option value="平台扣减">平台扣减</option>
            <option value="订单退款">订单退款</option>
          </select>
        </div>
        <div class="filter-field">
          <label>交易账户</label>
          <select id="flowAcctFilter" onchange="applyFlowFilter()">
            <option value="">全部账户</option>
            <option value="系统余额">系统余额</option>
            <option value="微信支付">微信支付</option>
          </select>
        </div>
        <div class="filter-field">
          <label>交易时间</label>
          <div class="date-range">
            <input type="date" id="flowDateFrom" onchange="applyFlowFilter()" />
            <span class="date-sep">~</span>
            <input type="date" id="flowDateTo" onchange="applyFlowFilter()" />
          </div>
        </div>
      </div>

      <!-- 明细表格 -->
      <div class="flow-table-wrap">
        <table class="table flow-table">
          <thead><tr><th>流水号</th><th>关联订单号</th><th>交易类型</th><th>交易金额</th><th>变动后余额</th><th>交易账户</th><th>交易时间</th></tr></thead>
          <tbody id="flowBody"></tbody>
        </table>
      </div>

      <!-- 分页 -->
      <div class="pagination-wrap" id="flowPagination"></div>
    </div>
  </div>

  <!-- 企业对公收款账户弹窗 -->
  <div class="modal-mask" id="corpMask">
    <div class="modal" style="max-width:460px">
      <h3><span>对公账户充值</span><button class="x" onclick="closeCorp()">×</button></h3>
      <p style="font-size:13px;color:var(--text-2);margin-bottom:14px">请通过对公转账向以下账户充值，到账后由财务人工加款。</p>
      <div class="corp-account" id="corpAccountBox"></div>
      <div class="banner" style="margin-top:14px">
        <div class="txt"><b>温馨提示</b><p id="corpNote"></p></div>
      </div>
      <button class="btn btn-primary btn-block" onclick="closeCorp()" style="margin-top:16px">我知道了</button>
    </div>
  </div>

  <script>
    var DB = App.DB;
    var s = App.getSession() || {};

    /* ========== 卡片数据 / 个人用户汇总 ========== */
    (function renderBalance() {
      // 从 FLOWS 计算累计消费与累计充值
      var flows = DB.FLOWS || [];
      var totalConsume = 0;   // 扣款类绝对值之和（话费充值 + 短信群发 + 平台扣减）
      var totalRecharge = 0;  // 增加类之和（平台充值 + 订单退款 + 微信支付等）
      flows.forEach(function (f) {
        if (f.amount < 0) { totalConsume += Math.abs(f.amount); }
        else { totalRecharge += f.amount; }
      });
      totalConsume = Math.round(totalConsume * 100) / 100;
      totalRecharge = Math.round(totalRecharge * 100) / 100;

      if (s.type === "enterprise") {
        // 企业用户：卡片数据（账户余额 / 可用预授信额度 / 累计消费金额 / 累计充值金额）
        var tiles = [
          { n: App.fmtMoney(s.balance), l: "账户余额", c: "blue" },
          { n: App.fmtMoney(s.creditLimit - s.usedCredit), l: "可用预授信额度", c: "green" },
          { n: App.fmtMoney(totalConsume), l: "累计消费金额", c: "" },
          { n: App.fmtMoney(totalRecharge), l: "累计充值金额", c: "" }
        ];
        document.getElementById("balanceTiles").innerHTML = tiles.map(function (t) {
          return '<div class="tile ' + t.c + '"><div class="n">' + t.n + '</div><div class="l">' + t.l + '</div></div>';
        }).join("");
      } else {
        // 个人用户：不展示卡片数据组件，改用交易明细区「累计消费金额」字段
        document.getElementById("balanceTiles").style.display = "none";
        var sum = document.getElementById("flowSummary");
        sum.style.display = "flex";
        sum.innerHTML =
          '<div class="flow-sum"><span class="flow-sum-l">累计消费金额</span><span class="flow-sum-n">' + App.fmtMoney(totalConsume) + '</span></div>';
      }
    })();

    /* ========== 充值入口（按用户类型分流） ========== */
    (function initRechargeEntry() {
      if (s.type !== "enterprise") {
        // 个人用户：不展示账户充值组件
        var rech = document.getElementById("rechEntry");
        if (rech) rech.style.display = "none";
        return;
      }
      document.getElementById("rechEntryDesc").textContent = "通过对公转账向平台账户充值，到账后由财务人工加款。";
    })();

    function isMobile() {
      return /Mobi|Android|iPhone|iPad|iPod|MicroMessenger/i.test(navigator.userAgent) || window.innerWidth <= 640;
    }

    function openRecharge() {
      if (s.type === "enterprise") {
        openCorp();
      } else {
        if (!isMobile()) {
          App.toast("个人用户充值请在手机端使用微信支付");
          return;
        }
        App.toast("正在调起微信支付…（原型演示）");
      }
    }

    /* --- 企业对公账户 --- */
    function openCorp() {
      var c = DB.CORP_ACCOUNT;
      document.getElementById("corpAccountBox").innerHTML =
        '<div class="ca-row"><span class="ca-k">收款户名</span><span class="ca-v">' + App.escapeHtml(c.company) + '</span></div>' +
        '<div class="ca-row"><span class="ca-k">开户银行</span><span class="ca-v">' + App.escapeHtml(c.bank) + '</span></div>' +
        '<div class="ca-row"><span class="ca-k">收款账号</span><span class="ca-v mono">' + App.escapeHtml(c.account) + '</span></div>';
      document.getElementById("corpNote").textContent = c.note + " " + c.support;
      document.getElementById("corpMask").classList.add("show");
    }
    function closeCorp() { document.getElementById("corpMask").classList.remove("show"); }

    /* ========== 交易明细：渲染 + 筛选 + 分页 ========== */

    // 分页常量
    var FLOW_PAGE_SIZE = 20;
    var flowCurrentPage = 1;

    // 交易类型 → 颜色规则：
    //   扣款类（话费充值/短信群发/平台扣减）→ red
    //   增加/退款类（平台充值/订单退款/微信支付等）→ green
    var FLOW_DEDUCT_TYPES = ["话费充值", "短信群发", "平台扣减"];

    function flowTypeBadge(type) {
      var isDeduct = FLOW_DEDUCT_TYPES.indexOf(type) !== -1;
      var cls = isDeduct ? "fail" : "success";
      return '<span class="badge ' + cls + '">' + type + '</span>';
    }

    function flowAmountColor(type, amount) {
      var isDeduct = FLOW_DEDUCT_TYPES.indexOf(type) !== -1;
      return isDeduct ? "var(--danger)" : "var(--success)";
    }

    // 渲染全部行（先隐藏，分页控制显示）
    function renderFlowRows() {
      var flows = DB.FLOWS || [];
      document.getElementById("flowBody").innerHTML = flows.map(function (f) {
        return '<tr data-id="' + f.id + '" data-type="' + f.type + '" data-account="' + f.account + '" data-order="' + (f.orderId || "") + '" data-time="' + f.time + '">' +
          '<td class="mono-sm">' + f.id + '</td>' +
          '<td class="mono-sm">' + (f.orderId ? ('<a href="order-detail.html?id=' + encodeURIComponent(f.orderId) + '" class="order-link">' + f.orderId + '</a>') : '<span class="muted-sm">—</span>') + '</td>' +
          '<td>' + flowTypeBadge(f.type) + '</td>' +
          '<td class="amount" style="color:' + flowAmountColor(f.type, f.amount) + '">' +
            (f.amount >= 0 ? "+" : "") + App.fmtMoney(f.amount) + '</td>' +
          '<td class="amount">' + App.fmtMoney(f.after) + '</td>' +
          '<td>' + f.account + '</td>' +
          '<td style="white-space:nowrap">' + f.time + '</td>' +
        '</tr>';
      }).join("");
    }

    // 筛选逻辑
    function applyFlowFilter() {
      var kw = (document.getElementById("flowKeyword").value || "").trim().toLowerCase();
      var typeF = document.getElementById("flowTypeFilter").value;
      var acctF = document.getElementById("flowAcctFilter").value;
      var dateFrom = document.getElementById("flowDateFrom").value;
      var dateTo = document.getElementById("flowDateTo").value;

      var rows = document.querySelectorAll("#flowBody tr");
      rows.forEach(function (row) {
        var show = true;
        if (kw) {
          var id = row.dataset.id.toLowerCase();
          var oid = row.dataset.order.toLowerCase();
          if (id.indexOf(kw) === -1 && oid.indexOf(kw) === -1) show = false;
        }
        if (typeF && row.dataset.type !== typeF) show = false;
        if (acctF && row.dataset.account !== acctF) show = false;
        if (dateFrom && row.dataset.time < dateFrom) show = false;
        if (dateTo && row.dataset.time > dateTo) show = false;
        row.style.display = show ? "" : "none";
      });

      flowCurrentPage = 1;
      applyFlowPagination();
    }

    // 分页逻辑
    function getVisibleFlowRows() {
      return Array.prototype.filter.call(
        document.querySelectorAll("#flowBody tr"),
        function (r) { return r.style.display !== "none"; }
      );
    }

    function applyFlowPagination() {
      var visible = getVisibleFlowRows();
      var total = visible.length;
      var totalPages = Math.max(1, Math.ceil(total / FLOW_PAGE_SIZE));
      if (flowCurrentPage > totalPages) flowCurrentPage = totalPages;

      var start = (flowCurrentPage - 1) * FLOW_PAGE_SIZE;
      visible.forEach(function (row, i) {
        row.style.display = (i >= start && i < start + FLOW_PAGE_SIZE) ? "" : "none";
      });

      renderFlowPaginationUI(totalPages, total);
    }

    function renderFlowPaginationUI(totalPages, total) {
      var wrap = document.getElementById("flowPagination");
      if (!wrap) return;
      if (totalPages <= 1) { wrap.innerHTML = ""; return; }

      wrap.innerHTML =
        '<button class="btn btn-outline btn-sm" onclick="goFlowPage(' + (flowCurrentPage - 1) + ')"' +
          (flowCurrentPage <= 1 ? ' disabled' : '') + '>上一页</button>' +
        '<span class="page-info">' + flowCurrentPage + ' / ' + totalPages +
          ' 页（共 ' + total + ' 条）</span>' +
        '<button class="btn btn-outline btn-sm" onclick="goFlowPage(' + (flowCurrentPage + 1) + ')"' +
          (flowCurrentPage >= totalPages ? ' disabled' : '') + '>下一页</button>';
    }

    function goFlowPage(p) {
      var visible = getVisibleFlowRows();
      var totalPages = Math.max(1, Math.ceil(visible.length / FLOW_PAGE_SIZE));
      if (p < 1 || p > totalPages) return;
      flowCurrentPage = p;
      applyFlowPagination();
    }

    /* ========== 初始化 ========== */
    renderFlowRows();
    applyFlowPagination();
  </script>
</body>
</html>
