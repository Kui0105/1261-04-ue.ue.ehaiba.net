<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>订单管理 · 话费代充系统</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/orders.css" />
</head>
<body>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>if (!App.requireLogin("orders")) document.write("");</script>

  <div class="container page">
    <!-- 页面标题 -->
    <div class="page-head">
      <h1>订单管理</h1>
      <p>用户查看所有已提交的充值/短信单，支持按订单编号、订单类型、税费、状态、提交时间多维度筛选，快速定位和跟踪订单。</p>
    </div>

    <!-- ===== 汇总统计卡片 ===== -->
    <div class="tiles" id="summaryTiles"></div>

    <!-- ===== 筛选栏 ===== -->
    <div class="panel order-filter-panel">
      <div class="order-filter-row">
        <div class="filter-field">
          <label>订单编号</label>
          <input type="text" id="fOrderId" placeholder="输入订单编号搜索" autocomplete="off" />
        </div>
        <div class="filter-field">
          <label>订单类型</label>
          <select id="fKind">
            <option value="">全部</option>
            <option value="recharge">话费充值</option>
            <option value="sms">短信群发</option>
          </select>
        </div>
        <div class="filter-field">
          <label>税费</label>
          <select id="fTax">
            <option value="">全部</option>
            <option value="taxed">含税</option>
            <option value="untaxed">未税</option>
          </select>
        </div>
        <div class="filter-field">
          <label>状态</label>
          <select id="fStatus">
            <option value="">全部</option>
            <option value="process">进行中</option>
            <option value="success">已完成</option>
          </select>
        </div>
        <div class="filter-field">
          <label>提交时间</label>
          <div class="date-range">
            <input type="date" id="fTimeStart" aria-label="开始日期" />
            <span class="date-sep">至</span>
            <input type="date" id="fTimeEnd" aria-label="结束日期" />
          </div>
        </div>
      </div>
      <div class="order-filter-actions">
        <button class="btn btn-primary" onclick="applyFilter()">查询</button>
        <button class="btn btn-outline" onclick="resetFilter()">重置</button>
      </div>
    </div>

    <!-- ===== 订单列表 ===== -->
    <div class="panel order-list-panel" style="padding:0;overflow-x:auto;-webkit-overflow-scrolling:touch">
      <table class="table order-table">
        <thead>
          <tr>
            <th style="width:150px">订单编号</th>
            <th style="width:80px">类型</th>
            <th style="width:60px">税费</th>
            <th style="width:100px">成功/失败/总数</th>
            <th style="width:120px">退款金额 / 支付总额</th>
            <th style="width:85px">状态</th>
            <th style="width:130px">提交时间</th>
            <th style="width:70px;text-align:center">操作</th>
          </tr>
        </thead>
        <tbody id="orderBody"></tbody>
      </table>

      <!-- 分页 -->
      <div class="pagination-wrap" id="paginationWrap"></div>
    </div>
  </div>

  <!-- ========== 订单详情弹窗 ========== -->
  <div class="modal-mask" id="detailMask">
    <div class="modal detail-modal">
      <h3><span id="detailTitle">订单明细</span><button class="x" onclick="closeDetail()">×</button></h3>
      <div id="detailBody"></div>
    </div>
  </div>

  <script>
    var DB = App.DB;
    var PAGE_SIZE = 20;
    var currentPage = 1;
    var filtered = [];

    /* ---------- 工具函数 ---------- */
    function countBy(orders, status) {
      return orders.filter(function (o) { return o.status === status; }).length;
    }

    // 状态徽标（订单级别）：仅 进行中 / 已完成 两种
    function orderStatusBadge(st) {
      if (st === "success" || st === "fail") return '<span class="badge success">已完成</span>';
      return '<span class="badge process">进行中</span>';
    }

    // 充值单条状态
    function rechargeRowBadge(st) {
      if (st === "success") return '<span class="badge success">充值成功</span>';
      if (st === "fail") return '<span class="badge fail">充值失败</span>';
      if (st === "pending") return '<span class="badge pending">待充值</span>';
      return '<span class="badge process">充值中</span>';
    }

    // 短信单条状态
    function smsRowBadge(st) {
      if (st === "success") return '<span class="badge success">发送成功</span>';
      if (st === "fail") return '<span class="badge fail">发送失败</span>';
      return '<span class="badge process">发送中</span>';
    }

    // 获取运营商名称
    function getCarrierLabel(key) {
      var c = DB.CARRIERS.find(function (x) { return x.key === key; });
      return c ? c.label : "-";
    }

    // 获取税费标签
    function getTaxLabel(tax) {
      return tax === "taxed" ? "含税（6%专票）" : "未税（普票）";
    }

    // 获取税费简写
    function getTaxShort(tax) {
      return tax === "taxed" ? "含税" : "未税";
    }

    /* ---------- 汇总统计 ---------- */
    function renderSummary(orders) {
      var tiles = [
        { n: orders.length, l: "订单数量", c: "" },
        { n: countBy(orders, "process") + countBy(orders, "pending"), l: "进行中", c: "blue" },
        { n: countBy(orders, "success") + countBy(orders, "fail"), l: "已完成", c: "green" }
      ];
      document.getElementById("summaryTiles").innerHTML = tiles.map(function (t) {
        return '<div class="tile ' + t.c + '"><div class="n">' + t.n + '</div><div class="l">' + t.l + '</div></div>';
      }).join("");
    }

    /* ---------- 列表渲染（含分页） ---------- */
    function renderList() {
      var body = document.getElementById("orderBody");
      var totalItems = filtered.length;
      var totalPages = Math.max(1, Math.ceil(totalItems / PAGE_SIZE));
      if (currentPage > totalPages) currentPage = totalPages;

      var start = (currentPage - 1) * PAGE_SIZE;
      var pageData = filtered.slice(start, start + PAGE_SIZE);

      if (!pageData.length) {
        body.innerHTML = '<tr><td colspan="8" class="empty-state"><div class="empty-inner"><div class="empty-icon">📋</div><div class="empty-text">暂无订单记录</div></div></td></tr>';
        renderPagination(totalPages);
        return;
      }

      body.innerHTML = pageData.map(function (o) {
        var kindBadge = o.kind === "sms"
          ? '<span class="badge info">短信群发</span>'
          : '<span class="badge gray">话费充值</span>';

        var taxShort = getTaxShort(o.tax);

        // 成功/失败数
        var succ = o.details ? o.details.filter(function (d) { return d.status === "success"; }).length : 0;
        var fail = o.details ? o.details.filter(function (d) { return d.status === "fail"; }).length : 0;
        var sfText = succ + '/' + fail + '/' + o.count;

        // 退款金额 / 支付总额（均显示正数金额，如 ¥500.00 / ¥1000.00）
        var refundAmt = 0;
        if (fail > 0 && o.unitPrice) {
          refundAmt = Math.round(o.unitPrice * fail * 100) / 100;
        } else if (fail > 0 && o.face) {
          var unitRate = o.tax === "taxed" ? 1.06 : 1;
          refundAmt = Math.round(o.face * unitRate * fail * 100) / 100;
        }
        var moneyCell = fail > 0
          ? App.fmtMoney(refundAmt) + ' / ' + App.fmtMoney(o.total)
          : App.fmtMoney(o.total);

        return '<tr>' +
          '<td><span class="order-id-cell">' + o.id + '</span></td>' +
          '<td>' + kindBadge + '</td>' +
          '<td>' + taxShort + '</td>' +
          '<td>' + sfText + '</td>' +
          '<td>' + moneyCell + '</td>' +
          '<td>' + orderStatusBadge(o.status) + '</td>' +
          '<td>' + o.createdAt + '</td>' +
          '<td style="text-align:center"><button type="button" class="btn-detail" onclick="openDetail(\'' + o.id + '\')">查看详情</button></td>' +
        '</tr>';
      }).join("");

      renderPagination(totalPages);
    }

    /* ---------- 分页 ---------- */
    function renderPagination(totalPages) {
      var wrap = document.getElementById("paginationWrap");
      if (totalPages <= 1) { wrap.innerHTML = ""; return; }
      wrap.innerHTML =
        '<button class="btn btn-outline btn-sm" onclick="goPage(' + (currentPage - 1) + ')"' + (currentPage <= 1 ? ' disabled' : '') + '>上一页</button>' +
        '<span class="page-info">' + currentPage + ' / ' + totalPages + ' 页（共 ' + filtered.length + ' 条）</span>' +
        '<button class="btn btn-outline btn-sm" onclick="goPage(' + (currentPage + 1) + ')"' + (currentPage >= totalPages ? ' disabled' : '') + '>下一页</button>';
    }

    function goPage(p) {
      var totalPages = Math.ceil(filtered.length / PAGE_SIZE);
      if (p < 1 || p > totalPages) return;
      currentPage = p;
      renderList();
    }

    /* ---------- 筛选 ---------- */
    function applyFilter() {
      var orderId = document.getElementById("fOrderId").value.trim().toUpperCase();
      var kind = document.getElementById("fKind").value;
      var tax = document.getElementById("fTax").value;
      var st = document.getElementById("fStatus").value;
      var startStr = document.getElementById("fTimeStart").value;
      var endStr = document.getElementById("fTimeEnd").value;

      filtered = DB.ORDERS.filter(function (o) {
        if (kind === "recharge" && o.kind === "sms") return false;
        if (kind === "sms" && o.kind !== "sms") return false;
        if (tax && o.tax !== tax) return false;
        if (st && o.status !== st) return false;
        if (orderId && o.id.toUpperCase().indexOf(orderId) === -1) return false;
        if (startStr || endStr) {
          var created = new Date(o.createdAt.replace(/-/g, "/"));
          if (startStr) {
            var sd = new Date(startStr + " 00:00:00");
            if (created < sd) return false;
          }
          if (endStr) {
            var ed = new Date(endStr + " 23:59:59");
            if (created > ed) return false;
          }
        }
        return true;
      });

      saveFilters();
      currentPage = 1;
      renderSummary(filtered);
      renderList();
    }

    function resetFilter() {
      document.getElementById("fOrderId").value = "";
      document.getElementById("fKind").value = "";
      document.getElementById("fTax").value = "";
      document.getElementById("fStatus").value = "";
      document.getElementById("fTimeStart").value = "";
      document.getElementById("fTimeEnd").value = "";
      localStorage.removeItem("hc_order_filters");
      filtered = DB.ORDERS.slice();
      currentPage = 1;
      renderSummary(DB.ORDERS);
      renderList();
    }

    // 搜索缓存：页面刷新后保留筛选条件
    function saveFilters() {
      try {
        localStorage.setItem("hc_order_filters", JSON.stringify({
          orderId: document.getElementById("fOrderId").value,
          kind: document.getElementById("fKind").value,
          tax: document.getElementById("fTax").value,
          status: document.getElementById("fStatus").value,
          timeStart: document.getElementById("fTimeStart").value,
          timeEnd: document.getElementById("fTimeEnd").value
        }));
      } catch(e) {}
    }

    function loadFilters() {
      try {
        var f = JSON.parse(localStorage.getItem("hc_order_filters"));
        if (!f) return;
        document.getElementById("fOrderId").value = f.orderId || "";
        document.getElementById("fKind").value = f.kind || "";
        document.getElementById("fTax").value = f.tax || "";
        document.getElementById("fStatus").value = f.status || "";
        document.getElementById("fTimeStart").value = f.timeStart || "";
        document.getElementById("fTimeEnd").value = f.timeEnd || "";
      } catch(e) {}
    }

    /* ========== 充值订单详情 ========== */
    function renderRechargeDetail(o) {
      // 运营商：优先用订单自带，否则按订单号稳定随机分配四家之一
      var carrierObj = null;
      if (o.carrier) carrierObj = DB.CARRIERS.find(function (c) { return c.key === o.carrier; }) || null;
      if (!carrierObj) {
        var h = 0;
        for (var ci = 0; ci < o.id.length; ci++) h = (h * 31 + o.id.charCodeAt(ci)) % DB.CARRIERS.length;
        carrierObj = DB.CARRIERS[h];
      }

      // 单价 & 总额（总额 = 单价 × 号码数量）
      var unitRate = o.tax === "taxed" ? 1.06 : 1;
      var unit = o.face * unitRate;
      var totalAmt = unit * o.count;

      // 明细按订单状态规整（已完成订单无"充值中/待充值"）
      var normDetails = getRechargeDetailsNorm(o);
      var succ = normDetails.filter(function (d) { return d.status === "success"; }).length;
      var fail = normDetails.filter(function (d) { return d.status === "fail"; }).length;
      var proc = normDetails.filter(function (d) { return d.status === "process" || d.status === "pending"; }).length;
      var refundTotal = Math.round(unit * fail * 100) / 100;

      var html =
        // 基本信息
        '<div class="detail-section-title">基本信息</div>' +
        '<table class="table detail-info-table"><tbody>' +
          '<tr><td class="info-label">订单号</td><td><b>' + o.id + '</b></td></tr>' +
          '<tr><td class="info-label">订单类型</td><td>话费充值</td></tr>' +
          '<tr><td class="info-label">运营商</td><td>' + carrierObj.label + '</td></tr>' +
          '<tr><td class="info-label">面额</td><td><b>' + o.face + ' 元</b></td></tr>' +
          '<tr><td class="info-label">税费类型</td><td>' + getTaxLabel(o.tax) + '</td></tr>' +
          '<tr><td class="info-label">单价</td><td class="amount">' + App.fmtMoney(unit) + '</td></tr>' +
          '<tr><td class="info-label">总额</td><td class="amount">' + App.fmtMoney(totalAmt) + '</td></tr>' +
          '<tr><td class="info-label">状态</td><td>' + orderStatusBadge(o.status) + '</td></tr>' +
          '<tr><td class="info-label">提交时间</td><td>' + o.createdAt + '</td></tr>' +
        '</tbody></table>' +

        // 卡片统计
        '<div class="tiles" style="margin-top:14px;margin-bottom:10px">' +
          '<div class="tile"><div class="n">' + o.count + '</div><div class="l">号码总数</div></div>' +
          '<div class="tile blue"><div class="n">' + proc + '</div><div class="l">充值中</div></div>' +
          '<div class="tile green"><div class="n">' + succ + '</div><div class="l">充值成功</div></div>' +
          '<div class="tile red"><div class="n">' + fail + '</div><div class="l">充值失败</div></div>' +
          '<div class="tile amber"><div class="n">' + App.fmtMoney(refundTotal) + '</div><div class="l">退款总额</div></div>' +
        '</div>' +

        // 明细筛选与导出
        '<div class="detail-toolbar">' +
          '<div class="detail-search">' +
            '<input type="text" id="detailPhoneSearch" placeholder="根据手机号筛选…" oninput="filterDetailRows(\'' + o.id + '\')" />' +
            '<select id="detailStatusFilter" onchange="filterDetailRows(\'' + o.id + '\')">' +
              '<option value="">全部状态</option>' +
              '<option value="success">充值成功</option>' +
              '<option value="fail">充值失败</option>' +
              '<option value="process">充值中</option>' +
            '</select>' +
          '</div>' +
          '<button class="btn btn-outline btn-sm" onclick="exportDetail(\'' + o.id + '\', \'recharge\')">导出数据</button>' +
        '</div>' +

        // 明细列表
        '<div class="detail-list-wrap" id="detailListWrap">' +
          buildRechargeDetailTable(normDetails) +
        '</div>' +

        '<div class="detail-footer-note">充值失败账号由第三方返回失败结果，系统自动原路退回对应金额至用户账户。</div>';

      return html;
    }

    function buildRechargeDetailTable(details) {
      return '<table class="table detail-sub-table"><thead><tr><th>手机号</th><th>状态</th><th>失败原因</th><th>回调时间</th></tr></thead><tbody>' +
        details.map(function (d) {
          return '<tr data-phone="' + d.phone + '" data-status="' + d.status + '">' +
            '<td>' + d.phone + '</td>' +
            '<td>' + rechargeRowBadge(d.status) + '</td>' +
            '<td>' + (d.reason || "-") + '</td>' +
            '<td>' + (d.callbackAt || "-") + '</td>' +
          '</tr>';
        }).join("") +
      '</tbody></table>';
    }

    /* ========== 短信订单详情 ========== */
    function renderSmsDetail(o, norm) {
      var succ = norm.filter(function (d) { return d.status === "success"; }).length;
      var fail = norm.filter(function (d) { return d.status === "fail"; }).length;
      var proc = norm.filter(function (d) { return d.status === "process"; }).length;
      var refundTotal = Math.round(o.unitPrice * fail * 100) / 100;

      var html =
        // 基本信息
        '<div class="detail-section-title">基本信息</div>' +
        '<table class="table detail-info-table"><tbody>' +
          '<tr><td class="info-label">订单号</td><td><b>' + o.id + '</b></td></tr>' +
          '<tr><td class="info-label">订单类型</td><td>短信群发</td></tr>' +
          '<tr><td class="info-label">税费类型</td><td>' + getTaxLabel(o.tax) + '</td></tr>' +
          '<tr><td class="info-label">单价</td><td class="amount">' + App.fmtMoney(o.unitPrice) + '/条</td></tr>' +
          '<tr><td class="info-label">总额</td><td class="amount">' + App.fmtMoney(o.total) + '</td></tr>' +
          '<tr><td class="info-label">状态</td><td>' + orderStatusBadge(o.status) + '</td></tr>' +
          '<tr><td class="info-label">提交时间</td><td>' + o.createdAt + '</td></tr>' +
        '</tbody></table>' +
        // 短信模板卡片：展示方式与「短信群发 → 选择模板」列表一致（模板名 + 短信签名 + 模板内容）
        (function () {
          var tp = (DB.SMS_TEMPLATES || []).find(function (x) { return x.name === o.template; });
          var tplName = tp ? tp.name : o.template;
          var sig = (tp && tp.signature) ? tp.signature : "海拔科技";
          var content = tp ? tp.content : "";
          return '<div class="detail-section-title">短信模板</div>' +
            '<div class="sms-tpl-picked">' +
              '<div class="sms-tpl-picked-head"><b>' + App.escapeHtml(tplName) + '</b></div>' +
              '<div class="sms-tpl-sig">短信签名：<b>' + App.escapeHtml(sig) + '</b></div>' +
              '<div class="sms-tpl-content">' + App.escapeHtml(content) + '</div>' +
              '<div class="sms-tpl-picked-foot">单条价格 <b>' + App.fmtMoney(o.unitPrice) + '</b> · ' + getTaxLabel(o.tax) + '</div>' +
            '</div>';
        })() +

        // 卡片统计
        '<div class="tiles" style="margin-top:14px;margin-bottom:10px">' +
          '<div class="tile"><div class="n">' + o.count + '</div><div class="l">号码总数</div></div>' +
          '<div class="tile blue"><div class="n">' + proc + '</div><div class="l">发送中</div></div>' +
          '<div class="tile green"><div class="n">' + succ + '</div><div class="l">发送成功</div></div>' +
          '<div class="tile red"><div class="n">' + fail + '</div><div class="l">发送失败</div></div>' +
          '<div class="tile amber"><div class="n">' + App.fmtMoney(refundTotal) + '</div><div class="l">退款总额</div></div>' +
        '</div>' +

        // 明细筛选与导出
        '<div class="detail-toolbar">' +
          '<div class="detail-search">' +
            '<input type="text" id="detailPhoneSearch" placeholder="根据手机号筛选…" oninput="filterDetailRows(\'' + o.id + '\')" />' +
            '<select id="detailStatusFilter" onchange="filterDetailRows(\'' + o.id + '\')">' +
              '<option value="">全部状态</option>' +
              '<option value="success">发送成功</option>' +
              '<option value="fail">发送失败</option>' +
              '<option value="process">发送中</option>' +
            '</select>' +
          '</div>' +
          '<button class="btn btn-outline btn-sm" onclick="exportDetail(\'' + o.id + '\', \'sms\')">导出数据</button>' +
        '</div>' +

        // 明细列表
        '<div class="detail-list-wrap" id="detailListWrap">' +
          buildSmsDetailTable(norm) +
        '</div>' +

        '<div class="detail-footer-note">发送失败条数由第三方返回失败结果，系统自动原路退回对应金额至用户账户。</div>';

      return html;
    }

    function buildSmsDetailTable(details) {
      return '<table class="table detail-sub-table"><thead><tr><th>手机号</th><th>状态</th><th>发送结果说明</th><th>回调时间</th></tr></thead><tbody>' +
        details.map(function (d) {
          return '<tr data-phone="' + d.phone + '" data-status="' + d.status + '">' +
            '<td>' + d.phone + '</td>' +
            '<td>' + smsRowBadge(d.status) + '</td>' +
            '<td>' + (d.reason || "-") + '</td>' +
            '<td>' + (d.callbackAt || "-") + '</td>' +
          '</tr>';
        }).join("") +
      '</tbody></table>';
    }

    /* ========== 打开详情 ========== */
    var currentDetailOrder = null;
    var currentDetailNorm = null;

    // 根据订单状态规整明细，保证订单状态与号码状态一致：
    // - 已完成（success / fail 均显示"已完成"）：号码全部结束，不存在 充值中 / 待充值
    // - 充值中（process / pending 均显示"充值中"）：号码已启动，不存在 待充值，且至少有一条仍在充值中
    function getRechargeDetailsNorm(o) {
      var displayDone = (o.status === "success" || o.status === "fail");
      if (displayDone) {
        return o.details.map(function (d) {
          if (d.status === "process" || d.status === "pending") {
            return { phone: d.phone, status: "success", reason: "", callbackAt: d.callbackAt || "-" };
          }
          return d;
        });
      }
      var mapped = o.details.map(function (d) {
        if (d.status === "pending") {
          return { phone: d.phone, status: "process", reason: "", callbackAt: d.callbackAt || "-" };
        }
        return d;
      });
      var hasProcess = mapped.some(function (d) { return d.status === "process"; });
      if (!hasProcess && mapped.length) {
        mapped[0] = { phone: mapped[0].phone, status: "process", reason: "", callbackAt: mapped[0].callbackAt || "-" };
      }
      return mapped;
    }

    // 短信明细规整，与充值保持一致：
    // - 已完成（success / fail 均显示"已完成"）：号码全部结束，不存在 发送中
    // - 进行中（process / pending 均显示"进行中"）：号码已启动，且至少有一条仍在发送中
    function getSmsDetailsNorm(o) {
      var displayDone = (o.status === "success" || o.status === "fail");
      if (displayDone) {
        return o.details.map(function (d) {
          if (d.status === "process" || d.status === "pending") {
            return { phone: d.phone, status: "success", reason: "", callbackAt: d.callbackAt || "-" };
          }
          return d;
        });
      }
      var mapped = o.details.map(function (d) {
        if (d.status === "pending") {
          return { phone: d.phone, status: "process", reason: "", callbackAt: d.callbackAt || "-" };
        }
        return d;
      });
      var hasProcess = mapped.some(function (d) { return d.status === "process"; });
      if (!hasProcess && mapped.length) {
        mapped[0] = { phone: mapped[0].phone, status: "process", reason: "", callbackAt: mapped[0].callbackAt || "-" };
      }
      return mapped;
    }

    function openDetail(id) {
      var o = DB.ORDERS.find(function (x) { return x.id === id; });
      if (!o) return;
      currentDetailOrder = o;

      if (o.kind === "sms") {
        currentDetailNorm = getSmsDetailsNorm(o);
        document.getElementById("detailTitle").textContent = "短信订单详情 · " + id;
        document.getElementById("detailBody").innerHTML = renderSmsDetail(o, currentDetailNorm);
      } else {
        currentDetailNorm = getRechargeDetailsNorm(o);
        document.getElementById("detailTitle").textContent = "充值订单详情 · " + id;
        document.getElementById("detailBody").innerHTML = renderRechargeDetail(o);
      }

      document.getElementById("detailMask").classList.add("show");
    }

    function closeDetail() {
      document.getElementById("detailMask").classList.remove("show");
      currentDetailOrder = null;
    }

    /* ========== 详情内筛选 ========== */
    function filterDetailRows(orderId) {
      if (!currentDetailOrder) return;
      var phoneKw = (document.getElementById("detailPhoneSearch").value || "").trim();
      var statusF = document.getElementById("detailStatusFilter").value;
      var rows = document.querySelectorAll("#detailListWrap tbody tr");

      rows.forEach(function (row) {
        var show = true;
        if (phoneKw && row.dataset.phone.indexOf(phoneKw) === -1) show = false;
        if (statusF && row.dataset.status !== statusF) show = false;
        row.style.display = show ? "" : "none";
      });
    }

    /* ========== 详情内导出（模拟 CSV 下载） ========== */
    function exportDetail(orderId, kind) {
      if (!currentDetailOrder) return;
      var o = currentDetailOrder;
      var rows = [];

      if (kind === "recharge") {
        rows.push(["手机号", "状态", "失败原因", "回调时间"]);
        (currentDetailNorm || o.details).forEach(function (d) {
          var stMap = { success: "充值成功", fail: "充值失败", pending: "待充值", process: "充值中" };
          rows.push([d.phone, stMap[d.status] || d.status, d.reason || "", d.callbackAt || ""]);
        });
      } else {
        rows.push(["手机号", "状态", "发送结果说明", "回调时间"]);
        (currentDetailNorm || o.details).forEach(function (d) {
          var stMap = { success: "发送成功", fail: "发送失败", process: "发送中" };
          rows.push([d.phone, stMap[d.status] || d.status, d.reason || "", d.callbackAt || ""]);
        });
      }

      var csv = "\uFEFF" + rows.map(function (r) { return r.join(","); }).join("\n");
      var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = orderId + "_明细.csv";
      a.click();
      URL.revokeObjectURL(url);
      App.toast("导出成功");
    }

    /* ========== 初始化 ========== */
    loadFilters();
    filtered = DB.ORDERS.slice();

    // 如果有缓存的筛选条件，自动应用一次
    var hasCached = !!localStorage.getItem("hc_order_filters");
    if (hasCached) {
      applyFilter();
    } else {
      renderSummary(DB.ORDERS);
      renderList();
    }
  </script>
</body>
</html>
