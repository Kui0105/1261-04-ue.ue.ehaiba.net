<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>订单管理 · 话费代充系统</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/orders.css" />
</head>
<body>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>if (!App.requireLogin("orders")) document.write("");</script>

  <div class="container page">
    <!-- 页面标题 -->
    <div class="page-head">
      <h1>订单管理</h1>
      <p>用户查看所有已提交的充值/短信单，支持按订单编号、订单类型、税费、状态、提交时间多维度筛选，快速定位和跟踪订单。</p>
    </div>

    <!-- ===== 汇总统计卡片 ===== -->
    <div class="tiles" id="summaryTiles"></div>

    <!-- ===== 筛选栏 ===== -->
    <div class="panel order-filter-panel">
      <div class="order-filter-row">
        <div class="filter-field">
          <label>订单编号</label>
          <input type="text" id="fOrderId" placeholder="输入订单编号搜索" autocomplete="off" />
        </div>
        <div class="filter-field">
          <label>订单类型</label>
          <select id="fKind">
            <option value="">全部</option>
            <option value="recharge">话费充值</option>
            <option value="sms">短信群发</option>
          </select>
        </div>
        <div class="filter-field">
          <label>税费</label>
          <select id="fTax">
            <option value="">全部</option>
            <option value="taxed">含税</option>
            <option value="untaxed">未税</option>
          </select>
        </div>
        <div class="filter-field">
          <label>状态</label>
          <select id="fStatus">
            <option value="">全部</option>
            <option value="process">进行中</option>
            <option value="success">已完成</option>
          </select>
        </div>
        <div class="filter-field">
          <label>提交时间</label>
          <div class="date-range">
            <input type="date" id="fTimeStart" aria-label="开始日期" />
            <span class="date-sep">至</span>
            <input type="date" id="fTimeEnd" aria-label="结束日期" />
          </div>
        </div>
      </div>
      <div class="order-filter-actions">
        <button class="btn btn-primary" onclick="applyFilter()">查询</button>
        <button class="btn btn-outline" onclick="resetFilter()">重置</button>
      </div>
    </div>

    <!-- ===== 订单列表 ===== -->
    <div class="panel order-list-panel" style="padding:0;overflow-x:auto;-webkit-overflow-scrolling:touch">
      <table class="table order-table">
        <thead>
          <tr>
            <th style="width:150px">订单编号</th>
            <th style="width:80px">类型</th>
            <th style="width:60px">税费</th>
            <th style="width:100px">成功/失败/总数</th>
            <th style="width:120px">退款金额 / 支付总额</th>
            <th style="width:85px">状态</th>
            <th style="width:130px">提交时间</th>
            <th style="width:70px;text-align:center">操作</th>
          </tr>
        </thead>
        <tbody id="orderBody"></tbody>
      </table>

      <!-- 分页 -->
      <div class="pagination-wrap" id="paginationWrap"></div>
    </div>
  </div>

  <script>
    var DB = App.DB;
    var PAGE_SIZE = 20;
    var currentPage = 1;
    var filtered = [];

    /* ---------- 工具函数 ---------- */
    function countBy(orders, status) {
      return orders.filter(function (o) { return o.status === status; }).length;
    }

    // 状态徽标（订单级别）：仅 进行中 / 已完成 两种
    function orderStatusBadge(st) {
      if (st === "success" || st === "fail") return '<span class="badge success">已完成</span>';
      return '<span class="badge process">进行中</span>';
    }

    // 获取税费简写
    function getTaxShort(tax) {
      return tax === "taxed" ? "含税" : "未税";
    }

    /* ---------- 汇总统计 ---------- */
    function renderSummary(orders) {
      var tiles = [
        { n: orders.length, l: "订单数量", c: "" },
        { n: countBy(orders, "process") + countBy(orders, "pending"), l: "进行中", c: "blue" },
        { n: countBy(orders, "success") + countBy(orders, "fail"), l: "已完成", c: "green" }
      ];
      document.getElementById("summaryTiles").innerHTML = tiles.map(function (t) {
        return '<div class="tile ' + t.c + '"><div class="n">' + t.n + '</div><div class="l">' + t.l + '</div></div>';
      }).join("");
    }

    /* ---------- 列表渲染（含分页） ---------- */
    function renderList() {
      var body = document.getElementById("orderBody");
      var totalItems = filtered.length;
      var totalPages = Math.max(1, Math.ceil(totalItems / PAGE_SIZE));
      if (currentPage > totalPages) currentPage = totalPages;

      var start = (currentPage - 1) * PAGE_SIZE;
      var pageData = filtered.slice(start, start + PAGE_SIZE);

      if (!pageData.length) {
        body.innerHTML = '<tr><td colspan="8" class="empty-state"><div class="empty-inner"><div class="empty-icon">📋</div><div class="empty-text">暂无订单记录</div></div></td></tr>';
        renderPagination(totalPages);
        return;
      }

      body.innerHTML = pageData.map(function (o) {
        var kindBadge = o.kind === "sms"
          ? '<span class="badge info">短信群发</span>'
          : '<span class="badge gray">话费充值</span>';

        var taxShort = getTaxShort(o.tax);

        // 成功/失败数
        var succ = o.details ? o.details.filter(function (d) { return d.status === "success"; }).length : 0;
        var fail = o.details ? o.details.filter(function (d) { return d.status === "fail"; }).length : 0;
        var sfText = succ + '/' + fail + '/' + o.count;

        // 退款金额 / 支付总额（均显示正数金额，如 ¥500.00 / ¥1000.00）
        var refundAmt = 0;
        if (fail > 0 && o.unitPrice) {
          refundAmt = Math.round(o.unitPrice * fail * 100) / 100;
        } else if (fail > 0 && o.face) {
          var unitRate = o.tax === "taxed" ? 1.06 : 1;
          refundAmt = Math.round(o.face * unitRate * fail * 100) / 100;
        }
        var moneyCell = fail > 0
          ? App.fmtMoney(refundAmt) + ' / ' + App.fmtMoney(o.total)
          : App.fmtMoney(o.total);

        return '<tr>' +
          '<td><span class="order-id-cell">' + o.id + '</span></td>' +
          '<td>' + kindBadge + '</td>' +
          '<td>' + taxShort + '</td>' +
          '<td>' + sfText + '</td>' +
          '<td>' + moneyCell + '</td>' +
          '<td>' + orderStatusBadge(o.status) + '</td>' +
          '<td>' + o.createdAt + '</td>' +
          '<td style="text-align:center"><button type="button" class="btn-detail" onclick="goDetail(\'' + o.id + '\')">查看详情</button></td>' +
        '</tr>';
      }).join("");

      renderPagination(totalPages);
    }

    /* ---------- 分页 ---------- */
    function renderPagination(totalPages) {
      var wrap = document.getElementById("paginationWrap");
      if (totalPages <= 1) { wrap.innerHTML = ""; return; }
      wrap.innerHTML =
        '<button class="btn btn-outline btn-sm" onclick="goPage(' + (currentPage - 1) + ')"' + (currentPage <= 1 ? ' disabled' : '') + '>上一页</button>' +
        '<span class="page-info">' + currentPage + ' / ' + totalPages + ' 页（共 ' + filtered.length + ' 条）</span>' +
        '<button class="btn btn-outline btn-sm" onclick="goPage(' + (currentPage + 1) + ')"' + (currentPage >= totalPages ? ' disabled' : '') + '>下一页</button>';
    }

    function goPage(p) {
      var totalPages = Math.ceil(filtered.length / PAGE_SIZE);
      if (p < 1 || p > totalPages) return;
      currentPage = p;
      renderList();
    }

    /* ---------- 筛选 ---------- */
    function applyFilter() {
      var orderId = document.getElementById("fOrderId").value.trim().toUpperCase();
      var kind = document.getElementById("fKind").value;
      var tax = document.getElementById("fTax").value;
      var st = document.getElementById("fStatus").value;
      var startStr = document.getElementById("fTimeStart").value;
      var endStr = document.getElementById("fTimeEnd").value;

      filtered = DB.ORDERS.filter(function (o) {
        if (kind === "recharge" && o.kind === "sms") return false;
        if (kind === "sms" && o.kind !== "sms") return false;
        if (tax && o.tax !== tax) return false;
        if (st && o.status !== st) return false;
        if (orderId && o.id.toUpperCase().indexOf(orderId) === -1) return false;
        if (startStr || endStr) {
          var created = new Date(o.createdAt.replace(/-/g, "/"));
          if (startStr) {
            var sd = new Date(startStr + " 00:00:00");
            if (created < sd) return false;
          }
          if (endStr) {
            var ed = new Date(endStr + " 23:59:59");
            if (created > ed) return false;
          }
        }
        return true;
      });

      saveFilters();
      currentPage = 1;
      renderSummary(filtered);
      renderList();
    }

    function resetFilter() {
      document.getElementById("fOrderId").value = "";
      document.getElementById("fKind").value = "";
      document.getElementById("fTax").value = "";
      document.getElementById("fStatus").value = "";
      document.getElementById("fTimeStart").value = "";
      document.getElementById("fTimeEnd").value = "";
      localStorage.removeItem("hc_order_filters");
      filtered = DB.ORDERS.slice();
      currentPage = 1;
      renderSummary(DB.ORDERS);
      renderList();
    }

    // 搜索缓存：页面刷新后保留筛选条件
    function saveFilters() {
      try {
        localStorage.setItem("hc_order_filters", JSON.stringify({
          orderId: document.getElementById("fOrderId").value,
          kind: document.getElementById("fKind").value,
          tax: document.getElementById("fTax").value,
          status: document.getElementById("fStatus").value,
          timeStart: document.getElementById("fTimeStart").value,
          timeEnd: document.getElementById("fTimeEnd").value
        }));
      } catch(e) {}
    }

    function loadFilters() {
      try {
        var f = JSON.parse(localStorage.getItem("hc_order_filters"));
        if (!f) return;
        document.getElementById("fOrderId").value = f.orderId || "";
        document.getElementById("fKind").value = f.kind || "";
        document.getElementById("fTax").value = f.tax || "";
        document.getElementById("fStatus").value = f.status || "";
        document.getElementById("fTimeStart").value = f.timeStart || "";
        document.getElementById("fTimeEnd").value = f.timeEnd || "";
      } catch(e) {}
    }


    /* ========== 跳转订单详情页 ========== */
    function goDetail(id) {
      location.href = "order-detail.html?id=" + encodeURIComponent(id);
    }

    /* ========== 初始化 ========== */
    loadFilters();
    filtered = DB.ORDERS.slice();

    // 如果有缓存的筛选条件，自动应用一次
    var hasCached = !!localStorage.getItem("hc_order_filters");
    if (hasCached) {
      applyFilter();
    } else {
      renderSummary(DB.ORDERS);
      renderList();
    }
  </script>
</body>
</html>
